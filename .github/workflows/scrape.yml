name: scrape

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC (07:17 Rome)
  workflow_dispatch:
    inputs:
      sources:
        description: "comma list (blank = all)"
        required: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # first run fetches ~1,800 detail pages at 1 req/s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Scrape
        run: |
          if [ -n "${{ github.event.inputs.sources }}" ]; then
            python -m scraper.bandi --sources "${{ github.event.inputs.sources }}"
          else
            python -m scraper.bandi
          fi

      - name: Commit data
        run: |
          git config user.name  "bandi-bot"
          git config user.email "bandi-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            NEW=$(python -c "import json;print(len(json.load(open('data/calls.json'))['new_this_run']))")
            git commit -m "data: $NEW new calls ($(date -u +%F))"
            git push
          fi
